[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmiclimits"
version = "0.1.0"
description = "Cosmic particle horizon plots with CRPropa-backed photon, proton, nuclei, and analytic neutrino absorption."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools]
packages = ["cosmiclimits", "cosmiclimits.photon", "cosmiclimits.proton", "cosmiclimits.nuclei", "cosmiclimits.neutrino", "data"]
